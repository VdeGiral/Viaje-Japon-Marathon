<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hakone Freepass</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }

        /* Cabecera */
        .header {
            width: 100%;
            padding: 18px 0;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
            font-weight: 700;
            font-size: 17px;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            font-size: 15px;
            color: #444;
            text-decoration: none;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Contenedor del Ticket */
        .ticket-container {
            width: 92%;
            max-width: 450px;
            margin-top: 15px;
        }

        .ticket-title-box {
            background-color: #f4f4f4;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            border-radius: 2px;
            margin-bottom: 25px;
        }

        .ticket-icon {
            font-size: 24px;
            margin-right: 15px;
            margin-top: -2px;
            filter: grayscale(1);
        }

        .ticket-title-text {
            font-weight: 900;
            font-size: 1.25em;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        /* Detalles */
        .label {
            font-size: 11px;
            color: #777;
            margin-bottom: 4px;
        }

        .value-large {
            font-size: 2.2em;
            font-weight: 800;
            line-height: 1;
        }

        .from-text {
            font-size: 1.8em;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .detail-group {
            margin-bottom: 25px;
        }

        /* Fechas */
        .dates-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
        }

        .date-box {
            width: 45%;
        }

        .separator {
            font-size: 2.2em;
            font-weight: 300;
            color: #333;
            padding-bottom: 2px;
        }

        /* Divisor perforado */
        .divider {
            width: 100%;
            border-top: 2px dashed #bbb;
            margin: 30px 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: -11px;
            width: 22px;
            height: 22px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 50%;
        }
        .divider::before { left: -28px; }
        .divider::after { right: -28px; }

        /* QR y Reloj */
        .qr-section {
            text-align: center;
            padding-bottom: 30px;
        }

        .time-container {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 15px;
        }

        #current-time-value {
            color: #e65c5c;
            font-size: 1.4em;
            margin-left: 5px;
        }

        .qr-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto;
            border: 1px solid #eee;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-image {
            width: 100%;
            height: 100%;
            /* Generamos un QR de alta densidad similar al tuyo */
            background-image: url('https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=HAKONE-FREEPASS-PRO-DATA-0923847102938475610239487123049871023948710239487&ecc=H&margin=1');
            background-size: cover;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            font-size: 10px;
            color: #bbb;
            text-align: center;
            width: 100%;
            padding: 40px 0 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="#" class="back-btn">〈 Back</a>
        Activated ticket
    </div>

    <div class="ticket-container">
        <div class="ticket-title-box">
            <span class="ticket-icon">🎟️</span>
            <div class="ticket-title-text">【KLOOK】 Digital Hakone Freepass</div>
        </div>

        <div class="detail-group">
            <div class="label">利用区間 (Section)</div>
            <div class="from-text">新宿<span style="font-size: 0.6em; font-weight: 600;">から</span></div>
            <div class="label" style="font-size: 10px;">From <b>Shinjuku</b></div>
        </div>

        <div class="detail-group">
            <div class="label">おとな (Adult)</div>
            <div class="value-large">1</div>
        </div>

        <div class="dates-row">
            <div class="date-box">
                <div class="label">利用開始日 (Ticket start date)</div>
                <div class="value-large" style="font-size: 1.8em;">2026.03.03</div>
            </div>
            <div class="separator">~</div>
            <div class="date-box" style="text-align: right;">
                <div class="label">利用終了日 (Ticket end date)</div>
                <div class="value-large" style="font-size: 1.8em;">2026.03.05</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="qr-section">
            <div class="time-container">
                Current Time <span id="current-time-value">0000.00.00 00:00:00</span>
            </div>
            <div class="qr-wrapper">
                <div class="qr-image"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        Copyright © Odakyu Electric Railway Co., Ltd. All Rights Reserved.
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const formattedTime = `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('current-time-value').textContent = formattedTime;
        }

        // Actualización cada 1000ms (1 segundo)
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
